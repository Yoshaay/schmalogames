<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Schmalogames — Operator</title>
    <style>
      /* TheSans (BR-Hausschrift) — liegt gebündelt in dist/renderer/fonts */
      @font-face {
        font-family: 'TheSans';
        src: url('fonts/TheSansC5s-5_Plain.otf') format('opentype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'TheSans';
        src: url('fonts/TheSansC5s-6_SemiBold.otf') format('opentype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'TheSans';
        src: url('fonts/TheSansC5s-7_Bold.otf') format('opentype');
        font-weight: 700;
      }
      @font-face {
        font-family: 'TheSans';
        src: url('fonts/TheSansC5s-8_ExtraBold.otf') format('opentype');
        font-weight: 800;
      }

      :root {
        --bg: #0e0f13;
        --panel: #16181f;
        --panel-edge: #262a35;
        --ink: #e8e9ee;
        --ink-dim: #7c8194;
        --primary: #94c01c;
        --primary-bright: #9be600;
        --primary-deep: #6d8f12;
        /* --primary als R,G,B-Tripel für rgba()-Abstufungen (Glows, Tints) */
        --primary-rgb: 148, 192, 28;
        --blue: #2699d6;
        --live: #e71d73;
        --ok: #9be600;
        --font-display: 'TheSans', 'Avenir Next Condensed', 'Futura', 'Arial Narrow', sans-serif;
        --font-mono: 'SF Mono', 'Menlo', 'Monaco', monospace;
        --font-body: 'TheSans', 'Avenir Next', 'Helvetica Neue', sans-serif;
      }

      /* Sender-Modus BAYERN 1: nur Schmalaoke, Akzent in BAYERN-1-Blau.
         Alle Akzent-Regeln hängen an --primary/--primary-rgb — der Rest
         der UI schaltet damit automatisch mit um. */
      body.mode-b1 {
        --primary: #00a0d5;
        --primary-bright: #2fc3f2;
        --primary-deep: #007aa3;
        --primary-rgb: 0, 160, 213;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* hidden-Attribut gewinnt immer — auch gegen display-Regeln wie .col */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 14px;
        overflow: hidden;
        user-select: none;
      }

      body {
        display: flex;
        flex-direction: column;
        background-image: radial-gradient(ellipse 80% 60% at 50% -10%, #1a1d28 0%, var(--bg) 60%);
      }

      /* ---------- Kopfzeile ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px 12px;
        border-bottom: 1px solid var(--panel-edge);
      }
      header h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.06em;
      }
      header h1 span {
        color: var(--primary);
      }
      .header-sub {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding-top: 6px;
      }
      .spacer {
        flex: 1;
      }

      /* ---------- Sender-Umschalter (BAYERN 3 / BAYERN 1) ---------- */
      .mode-switch {
        display: flex;
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        overflow: hidden;
      }
      .mode-switch button {
        height: 28px;
        padding: 0 12px;
        border: none;
        border-radius: 0;
        background: transparent;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
      }
      .mode-switch button + button {
        border-left: 1px solid var(--panel-edge);
      }
      .mode-switch button.active {
        background: rgba(var(--primary-rgb), 0.16);
        color: var(--primary);
        font-weight: 700;
      }

      /* ---------- Layout ---------- */
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        padding: 16px 20px 20px;
        min-height: 0;
      }
      /* Spiel-Panel als hochkante Sidebar links (panelLayout: 'sidebar') */
      main.with-sidebar {
        grid-template-columns: 430px 1fr 360px;
      }
      /* Rechte Spalte wäre leer (keine Regler/Aktionen) → ausblenden und
         den Platz dem Spiel-Panel bzw. der Vorschau geben */
      main.no-side {
        grid-template-columns: 1fr;
      }
      main.with-sidebar.no-side {
        grid-template-columns: minmax(560px, 48%) 1fr;
      }
      #sidebar-col {
        overflow-y: auto;
        padding-right: 4px;
      }
      #sidebar-col > .panel {
        flex-shrink: 0;
        /* feste Höhe (nicht min-height): nur so bekommt der Panel-Inhalt
           eine definite Höhe und die Listen scrollen INTERN statt das
           ganze Panel aus dem Fenster zu schieben */
        height: calc(100% - 2px);
        display: flex;
        flex-direction: column;
      }
      #sidebar-col > .panel #game-ui {
        flex: 1;
        min-height: 0;
      }
      #sidebar-col::-webkit-scrollbar {
        width: 8px;
      }
      #sidebar-col::-webkit-scrollbar-thumb {
        background: #2a2e37;
        border-radius: 4px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
      }
      /* Rechte Spalte: scrollt bei kleinen Fenstern, statt abgeschnitten zu werden */
      .col-side {
        overflow-y: auto;
        padding-right: 4px;
      }
      .col-side > .panel {
        flex-shrink: 0;
      }
      .col-side::-webkit-scrollbar {
        width: 8px;
      }
      .col-side::-webkit-scrollbar-thumb {
        background: #2a2e37;
        border-radius: 4px;
      }
      .col-side::-webkit-scrollbar-track {
        background: transparent;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 6px;
        padding: 14px 16px 16px;
      }
      .panel h2 {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel h2::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--panel-edge);
      }

      /* ---------- Spiele-Tab-Leiste (immer sichtbar) ---------- */
      #gamebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px 0;
      }
      #gamebar .head {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-right: 6px;
      }
      #games {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- Vorschau: echtes 16:9, füllt den verbleibenden Platz ----------
         Das Panel nimmt die Resthöhe der Spalte; der Frame skaliert sich als
         16:9-Rechteck in den verfügbaren Raum (Höhe oder Breite limitiert).
         So passt IMMER alles ohne Scrollen auf den Schirm. */
      .preview-panel {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .preview-wrap {
        flex: 1;
        min-height: 0;
        container-type: size;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }
      .preview-frame {
        /* exakt 16:9 (FHD) pro Wall, beide nebeneinander in Breite UND Höhe eingepasst */
        width: min(calc(50% - 4px), calc(100cqh * 16 / 9));
        aspect-ratio: 16 / 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .preview-tag {
        position: absolute;
        top: 6px;
        left: 8px;
        z-index: 1;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--ink-dim);
        background: rgba(0, 0, 0, 0.55);
        padding: 2px 6px;
        border-radius: 3px;
      }
      /* NDI-Tally vom Ü-Wagen: Magenta = Quelle liegt auf Programm (ON AIR),
         Gelb = auf Preview vorgewählt */
      .preview-tag.onair {
        background: var(--live);
        color: #ffffff;
        font-weight: 700;
      }
      .preview-tag.pvw {
        background: #f9b233;
        color: #101403;
        font-weight: 700;
      }
      .preview-frame video {
        max-width: 100%;
        max-height: 100%;
        display: block;
      }
      /* ---------- Status (kompakt — alles muss auf den Schirm) ---------- */
      #status {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }
      .stat {
        background: #101218;
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        padding: 7px 10px;
      }
      .stat .k {
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-bottom: 3px;
      }
      .stat .v {
        font-family: var(--font-mono);
        font-size: 17px;
        font-weight: 600;
        color: var(--primary);
        font-variant-numeric: tabular-nums;
      }
      .status-empty {
        font-size: 13px;
        color: var(--ink-dim);
      }

      /* ---------- Buttons ----------
         EIN Grundformat für alle Buttons (auch in den Game-Panels): feste
         Höhe, gleiche Schrift, gleiche Form. Varianten ändern nur Farben. */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--ink);
        background: #1d2029;
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.05s;
      }
      button:hover {
        background: #262a37;
        border-color: #3a4052;
      }
      button:active {
        transform: translateY(1px);
      }
      button.fullscreen-on {
        color: var(--primary);
        border-color: rgba(var(--primary-rgb), 0.4);
        background: rgba(var(--primary-rgb), 0.1);
      }
      .ndi-fps {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.15em;
        color: var(--ink-dim);
      }
      .ndi-fps select {
        font: inherit;
        color: inherit;
        background: #1d2029;
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        height: 34px;
        padding: 0 6px;
        cursor: pointer;
      }

      /* Maske ist ON AIR sichtbar — deutlich warnen, solange sie aktiv ist */
      button.mask-on {
        color: #ff5c5c;
        border-color: rgba(255, 92, 92, 0.5);
        background: rgba(255, 92, 92, 0.14);
      }

      .game-btn {
        border-left: 3px solid transparent;
      }
      .game-btn.active {
        border-left-color: var(--primary);
        background: linear-gradient(90deg, rgba(var(--primary-rgb), 0.14), transparent 85%);
        color: var(--primary);
      }

      .btn-stop {
        color: #f27bab;
        border-color: rgba(231, 29, 115, 0.35);
      }
      .btn-stop:hover {
        background: rgba(231, 29, 115, 0.12);
        border-color: rgba(231, 29, 115, 0.6);
      }

      .btn-action {
        width: 100%;
        margin-bottom: 8px;
        color: var(--primary);
        border-color: rgba(var(--primary-rgb), 0.4);
        font-weight: 600;
      }
      .btn-action:hover {
        background: rgba(var(--primary-rgb), 0.14);
        border-color: var(--primary-deep);
      }
      @keyframes action-hit {
        0% {
          background: rgba(var(--primary-rgb), 0.45);
        }
        100% {
          background: transparent;
        }
      }
      .btn-action.hit {
        animation: action-hit 0.2s ease;
      }
      .btn-action .key {
        display: inline-block;
        min-width: 18px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-dim);
        border: 1px solid var(--panel-edge);
        border-radius: 3px;
        padding: 1px 4px;
      }

      /* ---------- Regler ---------- */
      .setting {
        margin-bottom: 14px;
      }
      .setting .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .setting label {
        font-size: 13px;
        color: var(--ink);
      }
      .setting .val {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--primary);
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        width: 100%;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: #2a2e3b;
        outline: none;
      }
      input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--primary);
        border: 2px solid #0e0f13;
        box-shadow: 0 0 0 1px var(--primary-deep);
        cursor: grab;
      }
      input[type='range']:active::-webkit-slider-thumb {
        cursor: grabbing;
      }

      .hint {
        font-size: 12px;
        color: var(--ink-dim);
        line-height: 1.5;
      }

      /* ---------- Live-Fader ---------- */
      #live {
        display: flex;
        justify-content: center;
        gap: 36px;
        padding: 6px 0 2px;
      }
      .fader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .fader-val {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 600;
        color: var(--primary);
        font-variant-numeric: tabular-nums;
      }
      .fader-body {
        display: flex;
        align-items: stretch;
        gap: 12px;
        /* Luft für die überstehende Fader-Kappe an den Endanschlägen */
        margin: 10px 0;
      }
      .fader-scale {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-dim);
        transform: translateY(-0.5em);
        margin-bottom: -1em;
      }
      .fader-track {
        position: relative;
        width: 58px;
        height: 300px;
        background: #101218;
        border: 1px solid var(--panel-edge);
        border-radius: 6px;
        cursor: grab;
        touch-action: none;
      }
      .fader-track:active {
        cursor: grabbing;
      }
      /* Farbzonen wie das Meter auf der Wall: unten grün, dann orange, oben pink */
      .fader-zones {
        position: absolute;
        inset: 1px;
        border-radius: 5px;
        background: linear-gradient(
          to top,
          #94c01c 0%,
          #94c01c 50%,
          #f9b233 50%,
          #f9b233 75%,
          #e71d73 75%,
          #e71d73 100%
        );
      }
      .zones-hint {
        opacity: 0.12;
      }
      .fader-ticks {
        position: absolute;
        inset: 1px;
        border-radius: 5px;
        background: repeating-linear-gradient(
          to top,
          transparent 0,
          transparent calc(10% - 1px),
          rgba(255, 255, 255, 0.09) calc(10% - 1px),
          rgba(255, 255, 255, 0.09) 10%
        );
        pointer-events: none;
      }
      .fader-grip {
        position: absolute;
        left: -9px;
        right: -9px;
        height: 34px;
        margin-bottom: -17px;
        border-radius: 5px;
        background: linear-gradient(#3a3f4e, #20232d 45%, #171a22);
        border: 1px solid #4a5064;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      .fader-grip::after {
        content: '';
        position: absolute;
        left: 7px;
        right: 7px;
        top: 50%;
        height: 2px;
        margin-top: -1px;
        background: var(--primary);
        border-radius: 1px;
        box-shadow: 0 0 6px rgba(var(--primary-rgb), 0.7);
      }
      .fader-label {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SCHMALO<span>GAMES</span></h1>
      <div class="header-sub">Videowall Operator</div>
      <div
        class="mode-switch"
        id="mode-switch"
        title="Sender-Modus: BAYERN 3 = alle Spiele, BAYERN 1 = nur Schmalaoke (Akzent in BAYERN-1-Blau)"
      >
        <button data-mode="b3" class="active">BAYERN 3</button>
        <button data-mode="b1">BAYERN 1</button>
      </div>
      <div class="spacer"></div>
      <label
        class="ndi-fps"
        title="Framerate des NDI-Streams. Obergrenze ist der Display-Refresh des Wall-Rechners; 25/50 passt zur Broadcast-Welt, 30/60 läuft auf 60-Hz-Displays ruckelfrei."
      >
        NDI
        <select id="ndifps">
          <option value="25">25 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="50">50 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <button
        id="mask"
        title="Signal zeigt statt der Grafik die Alphamaske des Spiels (Weiß = Grafik, Schwarz = Live-Bild) — der Ü-Wagen greift sie als Key ab. Schaltet sich bei Spielstart/-stopp selbst aus."
      >
        Stanzmaske
      </button>
      <button id="winview" title="Welchen der beiden Streams das Wall-Fenster (HDMI-Fallback) zeigt">Fenster: Wall L</button>
      <button id="fullscreen">Wall-Vollbild</button>
    </header>

    <nav id="gamebar">
      <span class="head">Spiele</span>
      <div id="games"></div>
      <div class="spacer"></div>
      <button class="btn-stop" id="stop">Stop — Leerlaufbild</button>
    </nav>

    <main>
      <div class="col" id="sidebar-col" hidden></div>
      <div class="col">
        <div class="panel preview-panel">
          <h2>Vorschau — Videowall</h2>
          <div class="preview-wrap">
            <div class="preview-frame">
              <span class="preview-tag" id="tag-l">WALL L</span>
              <video id="preview-l" autoplay muted playsinline></video>
            </div>
            <div class="preview-frame">
              <span class="preview-tag" id="tag-r">WALL R</span>
              <video id="preview-r" autoplay muted playsinline></video>
            </div>
          </div>
        </div>
        <div class="panel" id="game-panel" hidden>
          <h2 id="game-panel-title">Spiel</h2>
          <div id="game-ui"></div>
        </div>
        <div class="panel">
          <h2>Status</h2>
          <div id="status"><div class="status-empty">Kein Spiel aktiv.</div></div>
        </div>
      </div>

      <div class="col col-side">
        <div class="panel" id="live-panel" hidden>
          <h2>Live</h2>
          <div id="live"></div>
        </div>
        <div class="panel">
          <h2>Einstellungen</h2>
          <div id="settings"><div class="hint">Spiel starten, um Einstellungen zu sehen.</div></div>
        </div>
        <div class="panel">
          <h2>Aktionen</h2>
          <div id="actions"><div class="hint">—</div></div>
        </div>
      </div>
    </main>

    <script src="operator.js"></script>
  </body>
</html>
